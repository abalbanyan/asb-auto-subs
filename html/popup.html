<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/popup.css">
</head>

<body>
  <form id="apiKeyForm">
    <label class="section-label" for="apiKey">Jimaku API Key</label>
    <input type="text" id="apiKey" name="apiKey">
    <div class="set-container">
      <button class="set-btn" type="submit">Set</button>
      <p class="key-info">A Jimaku API key is required for this extension. Get one on <a href="https://jimaku.cc/account">jimaku</a> then add it here.</p>
    </div>
  </form>
  <section class="settings-container">
    <h4 class="section-label">Settings</h4>
    <div class="settings-content">
      <input type="checkbox" name="autoDelete" id="autoDelete">
      <label for="autoDelete">Auto Deletion</label>
    </div>
    <div class="settings-content">
      <input type="checkbox" name="disableExtension" id="disableExtension">
      <label for="disableExtension">Disable extension</label>
    </div>
    <div class="settings-content">
      <input type="checkbox" name="disableSeries" id="disableSeries" disabled>
      <label for="disableSeries">Disable extension for this series</label>
    </div>
  </section>
  <section class="current-container">
    <hr class="section-divider">
    <h4 class="section-label">Current Series</h4>
    <p id="currentSeries">No supported series detected</p>
  </section>
  <section class="current-container">
    <h4 class="section-label">Current Episode</h4>
    <p id="currentEpisode">No supported episode detected</p>
  </section>
  <form id="subtitlePatternForm" class="pattern-container">
    <hr class="section-divider">
    <label class="section-label" for="savedSeries">Saved subtitle filters</label>
    <select id="savedSeries" name="savedSeries">
      <option value="">No saved series</option>
    </select>
    <div id="sourceSuggestions" class="source-suggestions" hidden>
      <label class="section-label">Suggested subtitle sources</label>
      <div id="sourceSuggestionLoading" class="source-suggestion-loading" hidden>
        <span class="source-suggestion-spinner" aria-hidden="true"></span>
        <span>Loading suggestions...</span>
      </div>
      <div id="sourceSuggestionList" class="source-suggestion-list"></div>
    </div>
    <label class="subtitle-pattern-label" for="subtitlePattern">Subtitle filename contains</label>
    <input type="text" id="subtitlePattern" name="subtitlePattern">
    <div class="pattern-actions">
      <button class="set-btn" type="submit">Save</button>
      <button class="set-btn" id="deletePattern" type="button">Delete</button>
    </div>
    <p id="patternInfo">Open a supported episode to configure this.</p>
  </form>
  <section class="jimaku-container">
    <a id="jimakuSubtitleLink" href="https://jimaku.cc" target="_blank" rel="noopener noreferrer" hidden>
      Jimaku Link
    </a>
  </section>
  <script src="../dist/popup.js"></script>
</body>

</html>
